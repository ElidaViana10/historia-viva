<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historiador Virtual – História Viva</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --parchment: #f5ecd7;
      --parchment-dark: #e8d9b8;
      --ink: #2c1810;
      --ink-light: #4a3020;
      --gold: #b8860b;
      --gold-light: #d4a017;
      --gold-bright: #f0c040;
      --red-seal: #8b1a1a;
      --shadow: rgba(44, 24, 16, 0.18);
      --shadow-deep: rgba(44, 24, 16, 0.38);
    }

    html, body {
      height: 100%;
      font-family: 'Source Sans 3', sans-serif;
      background: #1a0f08;
      color: var(--ink);
      overflow: hidden;
    }

    /* ── BACKGROUND ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(184,134,11,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(139,26,26,0.07) 0%, transparent 55%),
        repeating-linear-gradient(
          0deg, transparent, transparent 60px,
          rgba(184,134,11,0.03) 60px, rgba(184,134,11,0.03) 61px
        ),
        repeating-linear-gradient(
          90deg, transparent, transparent 60px,
          rgba(184,134,11,0.03) 60px, rgba(184,134,11,0.03) 61px
        );
      pointer-events: none; z-index: 0;
    }

    /* ── WRAPPER ── */
    #app {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; flex-direction: column;
      max-width: 820px;
      margin: 0 auto;
      padding: 16px 12px 12px;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      padding: 10px 0 8px;
      flex-shrink: 0;
      animation: fadeDown 0.8s ease both;
    }
    .header-emblem {
      font-size: 2rem;
      margin-bottom: 2px;
      filter: drop-shadow(0 0 8px rgba(212,160,23,0.6));
    }
    header h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      color: var(--gold-light);
      letter-spacing: 0.12em;
      text-shadow: 0 2px 12px rgba(184,134,11,0.5);
    }
    header p {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.78rem;
      color: rgba(245,236,215,0.55);
      margin-top: 2px;
      letter-spacing: 0.04em;
    }
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 8px 0 6px;
      opacity: 0.4;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .divider span { font-size: 0.65rem; color: var(--gold); letter-spacing: 0.2em; }

    /* ── CHAT WINDOW ── */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background:
        linear-gradient(180deg, rgba(245,236,215,0.04) 0%, rgba(245,236,215,0.07) 100%);
      border: 1px solid rgba(184,134,11,0.2);
      border-radius: 6px;
      box-shadow: inset 0 2px 20px rgba(0,0,0,0.3);
      scroll-behavior: smooth;
    }
    #chat-window::-webkit-scrollbar { width: 6px; }
    #chat-window::-webkit-scrollbar-track { background: transparent; }
    #chat-window::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.3); border-radius: 3px; }

    /* ── MESSAGES ── */
    .msg {
      display: flex; gap: 10px; align-items: flex-start;
      animation: fadeUp 0.4s ease both;
    }
    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      border: 1px solid rgba(184,134,11,0.3);
    }
    .avatar.bot { background: rgba(184,134,11,0.15); }
    .avatar.user-av { background: rgba(139,26,26,0.2); border-color: rgba(139,26,26,0.3); }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.88rem;
      line-height: 1.65;
      position: relative;
    }
    .msg.bot .bubble {
      background: rgba(245,236,215,0.09);
      border: 1px solid rgba(184,134,11,0.22);
      color: rgba(245,236,215,0.92);
      border-radius: 2px 8px 8px 8px;
    }
    .msg.user .bubble {
      background: rgba(139,26,26,0.25);
      border: 1px solid rgba(139,26,26,0.35);
      color: rgba(245,236,215,0.9);
      border-radius: 8px 2px 8px 8px;
    }
    .bubble strong { color: var(--gold-light); font-family: 'Lora', serif; }
    .bubble em { color: rgba(240,192,64,0.75); }

    .sender-name {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
      opacity: 0.55;
    }
    .msg.bot .sender-name { color: var(--gold); }
    .msg.user .sender-name { color: var(--red-seal); text-align: right; }

    /* typing indicator */
    .typing .bubble { padding: 12px 16px; }
    .typing-dots { display: flex; gap: 5px; align-items: center; }
    .typing-dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.4;
      animation: blink 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ── INPUT AREA ── */
    #input-area {
      display: flex; gap: 8px;
      padding: 10px 0 4px;
      flex-shrink: 0;
      animation: fadeUp 0.8s 0.3s ease both;
    }
    #user-input {
      flex: 1;
      background: rgba(245,236,215,0.06);
      border: 1px solid rgba(184,134,11,0.3);
      border-radius: 4px;
      color: rgba(245,236,215,0.92);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.88rem;
      padding: 10px 14px;
      resize: none;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      min-height: 44px; max-height: 100px;
      line-height: 1.5;
    }
    #user-input::placeholder { color: rgba(245,236,215,0.3); font-style: italic; }
    #user-input:focus {
      border-color: rgba(184,134,11,0.6);
      background: rgba(245,236,215,0.09);
    }

    #send-btn {
      background: linear-gradient(135deg, var(--gold) 0%, var(--red-seal) 100%);
      border: none; cursor: pointer;
      border-radius: 4px;
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
      align-self: flex-end;
      box-shadow: 0 2px 10px rgba(184,134,11,0.25);
    }
    #send-btn:hover { transform: translateY(-1px); opacity: 0.9; }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 5px 0 2px;
      font-size: 0.65rem;
      color: rgba(245,236,215,0.2);
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    /* ── WELCOME CHIPS ── */
    #suggestions {
      display: flex; flex-wrap: wrap; gap: 7px;
      padding: 4px 2px 6px;
      animation: fadeUp 0.7s 0.5s ease both;
      opacity: 0; /* filled by animation */
    }
    .chip {
      background: rgba(184,134,11,0.1);
      border: 1px solid rgba(184,134,11,0.28);
      color: rgba(245,236,215,0.7);
      font-size: 0.72rem;
      padding: 5px 11px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Lora', serif;
      font-style: italic;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .chip:hover {
      background: rgba(184,134,11,0.22);
      color: var(--gold-bright);
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.15; transform: scale(0.9); }
      40%            { opacity: 1;    transform: scale(1.15); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 500px) {
      #app { padding: 10px 8px 8px; }
      .bubble { max-width: 88%; font-size: 0.84rem; }
      header h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-emblem">📜</div>
    <h1>HISTORIADOR VIRTUAL</h1>
    <p>Projeto História Viva — Seu guia pelo tempo</p>
    <div class="divider"><span>✦ ✦ ✦</span></div>
  </header>

  <div id="chat-window"></div>

  <div id="suggestions">
    <span class="chip" onclick="sendChip(this)">🏛️ História do Brasil</span>
    <span class="chip" onclick="sendChip(this)">⚔️ Idade Média</span>
    <span class="chip" onclick="sendChip(this)">🔥 Revoluções</span>
    <span class="chip" onclick="sendChip(this)">🌍 História Geral</span>
    <span class="chip" onclick="sendChip(this)">🗣️ Falar com um personagem histórico</span>
  </div>

  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Faça sua pergunta ao Historiador Virtual…"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Enviar">➤</button>
  </div>

  <footer>História Viva &nbsp;·&nbsp; Powered by Claude AI</footer>
</div>

<script>
const SYSTEM_PROMPT = `Você é o Historiador Virtual do projeto História Viva.

Sua missão é ajudar estudantes do Ensino Fundamental e Médio a aprender História de forma interessante, clara e acolhedora.

Regras:
- Explique os conteúdos com linguagem simples e acessível.
- Adapte as respostas à idade aparente do aluno.
- Faça perguntas que estimulem o pensamento crítico ao final de cada resposta.
- Nunca faça a tarefa inteira para o aluno; ajude-o a raciocinar.
- Quando possível, utilize exemplos, histórias e curiosidades.
- Incentive a análise de diferentes pontos de vista históricos.
- Se o aluno pedir para conversar com um personagem histórico, assuma o papel do personagem com linguagem da época.
- Ao final de cada resposta, proponha sempre uma pergunta ou desafio relacionado ao tema.
- Use formatação clara: parágrafos curtos, destaques em negrito para nomes e datas importantes.
- Seja encorajador e acolhedor, celebrando a curiosidade do aluno.

Temas prioritários: História do Brasil, História Geral, História Antiga, Idade Média, Idade Moderna, Idade Contemporânea, Revoluções, Cidadania e Cultura.

Seu objetivo é despertar a curiosidade dos estudantes e ajudá-los a desenvolver autonomia nos estudos.`;

let messages = [];
let isLoading = false;

const chatWindow = document.getElementById('chat-window');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const suggestions = document.getElementById('suggestions');

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatMessage(text) {
  return escapeHtml(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function addMessage(role, content, isTyping = false) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + (role === 'user' ? 'user' : 'bot') + (isTyping ? ' typing' : '');

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (role === 'user' ? 'user-av' : 'bot');
  avatar.textContent = role === 'user' ? '🎓' : '📜';

  const wrap = document.createElement('div');
  const name = document.createElement('div');
  name.className = 'sender-name';
  name.textContent = role === 'user' ? 'Estudante' : 'Historiador Virtual';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (isTyping) {
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  } else {
    bubble.innerHTML = formatMessage(content);
  }

  wrap.appendChild(name);
  wrap.appendChild(bubble);
  msg.appendChild(avatar);
  msg.appendChild(wrap);
  chatWindow.appendChild(msg);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return { msg, bubble };
}

function sendChip(el) {
  input.value = el.textContent.replace(/^[^\s]+\s/, '').trim();
  suggestions.style.display = 'none';
  sendMessage();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isLoading) return;

  suggestions.style.display = 'none';
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  isLoading = true;

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  const { msg: typingEl } = addMessage('bot', '', true);

  try {
    const OR_KEY = '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';

    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${OR_KEY}`,
        'HTTP-Referer': 'https://elidaviana10.github.io/historia-viva/',
        'X-Title': 'Historiador Virtual - Historia Viva'
      },
      body: JSON.stringify({
        model: 'meta-llama/llama-3.3-8b-instruct:free',
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...messages
        ],
        max_tokens: 1000,
        temperature: 0.7
      })
    });

    const data = await res.json();
    typingEl.remove();

    const reply = data?.choices?.[0]?.message?.content;
    if (reply) {
      messages.push({ role: 'assistant', content: reply });
      addMessage('bot', reply);
    } else {
      addMessage('bot', '⚠️ Não consegui obter uma resposta. Tente novamente.');
    }
  } catch (err) {
    typingEl.remove();
    addMessage('bot', '⚠️ Erro de conexão. Verifique sua internet e tente novamente.');
    console.error(err);
  }

  sendBtn.disabled = false;
  isLoading = false;
  input.focus();
}

// Welcome message
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    addMessage('bot', `Saudações, jovem estudante! 📜\n\nSou o **Historiador Virtual** do projeto *História Viva*. Estou aqui para ser seu guia pelas páginas do tempo — das civilizações antigas às revoluções modernas, passando pela rica história do Brasil.\n\nPode me perguntar sobre qualquer período histórico, pedir explicações sobre conteúdos da escola ou até *conversar com um personagem histórico* famoso!\n\n🧭 **Por onde você gostaria de começar a nossa viagem?**`);
    messages.push({
      role: 'assistant',
      content: 'Saudações, jovem estudante! Sou o Historiador Virtual do projeto História Viva. Estou aqui para ser seu guia pelas páginas do tempo. Por onde você gostaria de começar?'
    });
  }, 600);
});
</script>
</body>
</html>
